<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#181e2b"/>
      <stop offset="100%" stop-color="#0a0c12"/>
    </radialGradient>

    <!-- Neon Gradients -->
    <linearGradient id="cyanPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5FF"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>

    <linearGradient id="spokeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5FF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0.9"/>
    </linearGradient>

    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E0FFFF"/>
      <stop offset="40%" stop-color="#00E5FF"/>
      <stop offset="85%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </radialGradient>

    <radialGradient id="nodeGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#A5F3FC"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </radialGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="480" height="480" rx="108" fill="none" stroke="#262F45" stroke-width="3"/>

  <!-- Outer Interconnecting Mesh Ring -->
  <circle cx="256" cy="256" r="140" fill="none" stroke="url(#cyanPurple)" stroke-width="4.5" opacity="0.8" filter="url(#subtleGlow)"/>

  <!-- Subtle Outer Pulse Ring -->
  <circle cx="256" cy="256" r="172" fill="none" stroke="#6366F1" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.3"/>

  <!-- Hub Spokes (Connections from Center to Satellite Nodes) -->
  <g stroke="url(#spokeGrad)" stroke-width="5" stroke-linecap="round" filter="url(#subtleGlow)">
    <line x1="256" y1="256" x2="256" y2="116" />
    <line x1="256" y1="256" x2="389" y2="213" />
    <line x1="256" y1="256" x2="338" y2="369" />
    <line x1="256" y1="256" x2="174" y2="369" />
    <line x1="256" y1="256" x2="123" y2="213" />
  </g>

  <!-- Ambient Glow Behind Center Core -->
  <circle cx="256" cy="256" r="70" fill="#00F5FF" opacity="0.18" filter="url(#glow)"/>

  <!-- Satellite Nodes (Surrounding Nodes) -->
  <g filter="url(#subtleGlow)">
    <!-- Top Node -->
    <circle cx="256" cy="116" r="22" fill="#131826" stroke="url(#cyanPurple)" stroke-width="4.5"/>
    <circle cx="256" cy="116" r="10" fill="url(#nodeGrad)"/>

    <!-- Top-Right Node -->
    <circle cx="389" cy="213" r="22" fill="#131826" stroke="url(#cyanPurple)" stroke-width="4.5"/>
    <circle cx="389" cy="213" r="10" fill="url(#nodeGrad)"/>

    <!-- Bottom-Right Node -->
    <circle cx="338" cy="369" r="22" fill="#131826" stroke="url(#cyanPurple)" stroke-width="4.5"/>
    <circle cx="338" cy="369" r="10" fill="url(#nodeGrad)"/>

    <!-- Bottom-Left Node -->
    <circle cx="174" cy="369" r="22" fill="#131826" stroke="url(#cyanPurple)" stroke-width="4.5"/>
    <circle cx="174" cy="369" r="10" fill="url(#nodeGrad)"/>

    <!-- Top-Left Node -->
    <circle cx="123" cy="213" r="22" fill="#131826" stroke="url(#cyanPurple)" stroke-width="4.5"/>
    <circle cx="123" cy="213" r="10" fill="url(#nodeGrad)"/>
  </g>

  <!-- Center Master Hub (Big Core Node) -->
  <g filter="url(#glow)">
    <!-- Outer Core Halo -->
    <circle cx="256" cy="256" r="54" fill="#101422" stroke="url(#cyanPurple)" stroke-width="5"/>
    <!-- Glowing Core Center -->
    <circle cx="256" cy="256" r="36" fill="url(#centerGlow)"/>
    <!-- Inner Core Highlight -->
    <circle cx="246" cy="246" r="10" fill="#FFFFFF" opacity="0.6"/>
  </g>
</svg>
